# Runs the pre-commit checks on every pull request and every push to main, so a commit made with
# the hook skipped still gets checked.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # macOS on ARM: the app's platform, and the platform whose tool binaries were reviewed.
    runs-on: macos-latest
    steps:
      # Pinned by commit. The tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches npm's download cache (~/.npm), keyed on package-lock.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # The repo's .npmrc sets ignore-scripts, so installing runs no package code.
      - run: npm ci
      # The browser tests run headless Chromium. Its download is cached per Playwright version, so
      # it happens only when package-lock.json moves Playwright.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npm run browsers
      - run: npm run check
