# Publishes a release when a v<version> tag is pushed (npm run release pushes one): runs the
# pre-commit checks, builds the files install.sh downloads, attests each one, and uploads them with
# SHA256SUMS. `gh attestation verify <file> --repo Farmer-Pete/anno-tater` ties a file to this run.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    # macOS on ARM, like the Check workflow.
    runs-on: macos-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      # Pinned by commit. The tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: The tag names package.json's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # The repo's .npmrc sets ignore-scripts, so installing runs no package code.
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npm run browsers
      - run: npm run check
      - run: node scripts/package.ts
      # Red-teamed before adding: GitHub's action, signed commits, talks only to GitHub and Sigstore.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Anno Tater ${GITHUB_REF_NAME#v}" --generate-notes dist/release/*
